name: Firefox release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firefox-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish a new version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          TAG="v$VERSION"
          # Query successfully before deciding a release is absent; do not mask API errors.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$TAG" /tmp/release-tags; then
            echo "Release $TAG already exists. Bump both package and manifest versions for another update."
            exit 0
          fi
          gh release create "$TAG" cfchart.xpi cfchart-chrome.zip updates.json \
            --target "$GITHUB_SHA" --title "CFChart $VERSION" \
            --notes "Firefox update package. For initial installation, download cfchart.xpi and use about:addons → Install Add-on From File. Future versions update automatically." \
            --latest
